name: ScreenOverIP
options:
  bundleIdPrefix: com.screenoverip
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  ScreenOverIP:
    type: application
    platform: macOS
    sources:
      - path: ScreenOverIP
        excludes:
          - "Info.plist"
          - "ScreenOverIP.entitlements"
    resources:
      - path: ScreenOverIP/Resources
    info:
      path: ScreenOverIP/Info.plist
      properties:
        CFBundleName: ScreenOverIP
        CFBundleDisplayName: Screen Over IP
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        LSUIElement: false
        NSHumanReadableCopyright: ""
        NSScreenCaptureUsageDescription: "ScreenOverIP needs Screen Recording permission to capture and stream your display to a browser."
        NSLocalNetworkUsageDescription: "ScreenOverIP serves your screen on the local network so browsers can connect."
        NSBonjourServices:
          - _http._tcp
    entitlements:
      path: ScreenOverIP/ScreenOverIP.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.server: true
        com.apple.security.network.client: true
        com.apple.security.device.camera: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screenoverip.app
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
